# Test settings, read by utils.PropertyLoader before each test class.
# Any key can be overridden for one run: mvn test -D<key>=<value>, e.g. -Dbrowser=firefox

# --- OrangeHRM demo pages (public demo site) ---
actualURL = https://opensource-demo.orangehrmlive.com/web/index.php/dashboard/index
adminPageURL = https://opensource-demo.orangehrmlive.com/web/index.php/admin/viewSystemUsers
loginPageURL = https://opensource-demo.orangehrmlive.com/web/index.php/auth/login

# --- Login: the public demo account shown on the OrangeHRM login page (not a secret) ---
userName = Admin
password = admin123

# --- Browser ---
# chrome, firefox or edge (Selenium Manager downloads the matching driver)
browser = chrome
# true = no browser window (CI); the window is then 1920x1080
headless = false

# --- Waits ---
# Seconds BrowserAction waits for an element or a URL before failing
waitSeconds = 10
